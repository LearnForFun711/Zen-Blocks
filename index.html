
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen Blocks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --anim-speed: 0.4s;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      touch-action: none;
      background-color: #fdfaf6;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    .floating {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes block-clear {
      0% { 
        transform: scale(1) translateY(0); 
        opacity: 1; 
        filter: brightness(1.5); 
      }
      100% { 
        transform: scale(0.6) translateY(-15px); 
        opacity: 0; 
        filter: brightness(2); 
      }
    }
    .clearing-animation {
      animation: block-clear var(--anim-speed) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      will-change: transform, opacity;
      transform: translateZ(0); 
    }

    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .perfect-ripple {
      position: absolute;
      border: 4px solid #fff;
      border-radius: 50%;
      animation: ripple 1.2s ease-out forwards;
      pointer-events: none;
    }

    @keyframes fade-in-scale {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-overlay {
      animation: fade-in-scale 0.5s ease-out forwards;
    }

    @keyframes quick-fill {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .perfect-fill-cell {
      animation: quick-fill 0.15s ease-out forwards;
    }

    @keyframes global-fade-out {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.8); }
    }
    .perfect-fade-out {
      animation: global-fade-out 0.4s ease-in forwards;
    }

    /* Simple hide scrollbar */
    ::-webkit-scrollbar {
      display: none;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="text-[#7d6e63]">
  <div id="root"></div>
</body>
</html>
